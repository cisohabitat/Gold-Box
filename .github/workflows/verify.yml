name: Game quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --user 1001
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Engine regressions
        run: |
          node tests/regression.cjs
          node tests/balance-checks.cjs
          node tests/sprites.cjs
          node tests/treasure-rules.cjs
          node tests/loadout-rules.cjs
          node tests/decisions-rules.cjs
          node tests/placement-rules.cjs
          node tests/setpiece-rules.cjs
          node tests/warden-rules.cjs
          node tests/cantor-rules.cjs
          node tests/fresh-review-rules.cjs
          node tests/exploration-rules.cjs
          node tests/exploration-audit.cjs
          node tests/treasure-audit.cjs
          node tests/scenario-balance.cjs
      - name: Install development browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/gold-box-tools" --no-package-lock --ignore-scripts playwright@1.62.1
          echo "NODE_PATH=$RUNNER_TEMP/gold-box-tools/node_modules" >> "$GITHUB_ENV"
          node -e 'const p=require(process.env.RUNNER_TEMP+"/gold-box-tools/node_modules/playwright"); for (const name of ["chromium","firefox","webkit"]) if(!require("node:fs").existsSync(p[name].executablePath())) throw Error("Pinned image/browser mismatch: "+name);'
      - name: Browser and campaign release checks
        env:
          GOLD_BOX_BROWSER: ${{ matrix.browser }}
        run: |
          if [ "$GOLD_BOX_BROWSER" = chromium ]; then
            export CHROMIUM_PATH="$(node -p 'require("playwright").chromium.executablePath()')"
          fi
          node tests/serve.cjs > "$RUNNER_TEMP/gold-box-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/devices.cjs
          node tests/quality.cjs
          node tests/polish.cjs
          node tests/sprite-browser.cjs
          node tests/flow.cjs
          node tests/epic.cjs
          node tests/campaign-payoff.cjs
          node tests/objectives.cjs
          node tests/atlas.cjs
          node tests/guardians.cjs
          node tests/confidence.cjs
          node tests/arenas.cjs
          node tests/patrols.cjs
          node tests/enemies.cjs
          node tests/projectiles.cjs
          node tests/companions.cjs
          node tests/treasures.cjs
          node tests/loadouts.cjs
          node tests/decisions.cjs
          node tests/setpieces.cjs
          node tests/exploration-flow.cjs
          node tests/warden.cjs
          node tests/cantor.cjs
          node tests/usability.cjs
          node tests/fresh-review.cjs
          if [ "$GOLD_BOX_BROWSER" = chromium ]; then
            node tests/balance.cjs
            node tests/companion-campaign.cjs
            node tests/treasure-campaign.cjs
            node tests/decision-campaign.cjs
          fi

      - name: Upload balance report
        if: always() && matrix.browser == 'chromium'
        uses: actions/upload-artifact@v4
        with:
          name: balance-${{ github.sha }}
          path: |
            artifacts/balance/
            artifacts/scenarios/
            artifacts/companions/
            artifacts/treasure/
            artifacts/decisions/
            artifacts/exploration/
            artifacts/usability/
            artifacts/fresh-review/
          if-no-files-found: warn
